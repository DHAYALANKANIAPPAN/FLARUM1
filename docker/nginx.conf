server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # Root directory for Flarum public folder so assets, JS, and CSS resolve natively
    root /var/www/html/public;
    index index.php;

    # 1. Handle Flarum dynamic assets, uploads, and core files directly
    location /assets {
        try_files $uri $uri/ =404;
    }

    # 2. Serve your custom frontend files under /custom/
    location /custom {
        alias /usr/share/nginx/html/custom;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # 3. Main Flarum routing, API calls, and forum views
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 4. PHP-FPM processing for Flarum
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
