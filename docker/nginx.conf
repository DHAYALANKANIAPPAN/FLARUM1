server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # Root directory for your custom static HTML files
    root /usr/share/nginx/html/custom;
    index index.html;

    # Serve custom frontend files at root if they exist, otherwise pass to Flarum
    location / {
        try_files $uri $uri/ @flarum;
    }

    # Internal routing fallback to Flarum PHP application
    location @flarum {
        root /var/www/html/public;
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_read_timeout 120;
    }

    # Handle direct access to Flarum PHP files, API, and assets
    location ~ ^/(index|admin|api)\.php$ {
        root /var/www/html/public;
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_read_timeout 120;
    }

    location ~ \.php$ {
        root /var/www/html/public;
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
