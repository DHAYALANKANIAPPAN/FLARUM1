server {
    listen 80;
    server_name devopsforum.nerdlab.co.in;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    # ---- Custom UI prototype: isolated, never intercepts / or /api ----
    location /custom/ {
        alias /var/www/html/custom/;
        try_files $uri $uri/ =404;
    }

    # ---- Flarum's compiled assets: matched BEFORE the catch-all below.
    #      This is the fix for the translation-key bug — previously a broad
    #      location block could intercept these requests and serve the wrong
    #      content (e.g. HTML) for forum.js / forum-en.js, which the browser
    #      would still "load" but not actually execute as valid translations. ----
    location ^~ /assets/ {
        alias /var/www/html/public/assets/;
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # ---- Block access to sensitive files and directories ----
    location ~* ^/(\.git|composer\.(json|lock)|auth\.json|config\.php|storage|vendor|extensions|flarum$) {
        deny all;
        return 404;
    }

    # ---- PHP-FPM ----
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 300;
    }

    # ---- Catch-all: Flarum's own PHP router handles everything else,
    #      including /api. This block is intentionally LAST. ----
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
