server {
    listen 80;
    server_name _;

    root /data;
    index index.php;

    client_max_body_size 20M;

    # Flarum's application code lives in the app container's image, not here —
    # nginx only needs to serve compiled assets directly and proxy everything
    # else to PHP-FPM, which has the real filesystem.
    location ^~ /assets/ {
        alias /data/assets/;
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    location ~* ^/(\.git|composer\.(json|lock)|auth\.json|config\.php|storage|vendor|extensions) {
        deny all;
        return 404;
    }

    location / {
        try_files $uri @php;
    }

    location @php {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_read_timeout 300;
    }
}
