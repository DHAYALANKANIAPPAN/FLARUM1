server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # Serve your custom frontend files at the root
    root /usr/share/nginx/html/custom;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Route Flarum forum traffic under /forum
    location /forum {
        alias /var/www/html/public;
        index index.php;
        try_files $uri $uri/ /forum/index.php?$query_string;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass app:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_read_timeout 120;
        }
    }

    # Route Flarum API traffic so logins and requests resolve correctly
    location /api {
        alias /var/www/html/public;
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass app:9000;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_read_timeout 120;
        }
    }

    # Handle Flarum assets and dynamic PHP files for forum and api paths
    location ~ ^/(forum|api)/(.+\.php)$ {
        alias /var/www/html/public/$2;
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/$2;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
