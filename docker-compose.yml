services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: flarum1-app
    depends_on:
      db:
        condition: service_healthy
        required: true
    environment:
      APP_URL: http://13.217.92.54:8000
      DB_HOST: db
      DB_NAME: flarum
      DB_PASS: secret
      DB_USER: flarum
    restart: always
    volumes:
      - flarum_public:/var/www/html/public
      - flarum_storage:/var/www/html/storage
      - flarum_data:/var/www/html

  db:
    image: mariadb:10.11
    container_name: flarum1-db-1
    environment:
      MYSQL_DATABASE: flarum
      MYSQL_USER: flarum
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "flarum", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    volumes:
      - db_data:/var/lib/mysql

  nginx:
    image: nginx:alpine
    container_name: flarum1-nginx-1
    depends_on:
      - app
    ports:
      - "8000:80"
    restart: always
    volumes:
      - flarum_public:/var/www/html/public:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html/custom:ro

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=StrongAdminPasswordHere
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  db_data:
    name: flarum1_db_data
  flarum_data:
  flarum_public:
  flarum_storage:
  prometheus_data:
  grafana_data:
