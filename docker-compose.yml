services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_URL: ${APP_URL}
    volumes:
      # Single persistent volume holds everything that must survive rebuilds:
      # config.php, storage/ (uploads, cache, logs), and public/assets (compiled JS/CSS).
      # The entrypoint symlinks these into place inside the image filesystem.
      - flarum_data:/data
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Nginx reads compiled assets directly from the SAME volume the app writes to.
      # This is the fix for the overlapping-volume/stale-asset bug: there is now
      # exactly one physical location for assets, mounted read-only here.
      - flarum_data:/data:ro
      # Custom UI prototype, isolated under /custom/ only — never intercepts / or /api.
      - ./frontend:/var/www/html/custom:ro
    networks:
      - internal

networks:
  internal:

volumes:
  db_data:
  flarum_data:
