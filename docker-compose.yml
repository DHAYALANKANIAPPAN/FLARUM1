services:
  db:
    container_name: flarum1-db-1
    image: mariadb:10.11
    environment:
      MYSQL_DATABASE: flarum
      MYSQL_USER: flarum
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "flarum", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: flarum1-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_URL: "http://54.196.68.171:8000"
      DB_HOST: db
      DB_NAME: flarum
      DB_USER: flarum
      DB_PASS: secret
    volumes:
      - flarum_public:/var/www/html/public
      - flarum_storage:/var/www/html/storage
      - flarum_data:/var/www/html
    restart: always

  nginx:
    container_name: flarum1-nginx-1
    image: nginx:alpine
    depends_on:
      app:
        condition: service_started
    ports:
      - "8000:80"
    volumes:
      - flarum_public:/var/www/html/public:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html/custom:ro
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: flarum1-prometheus
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: flarum1-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_storage:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  db_data:
    name: flarum1_db_data
  flarum_public:
  flarum_storage:
  flarum_data:
  prometheus_data:
  grafana_storage:
