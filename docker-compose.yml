services:
  db:
    image: mariadb:10.11
    container_name: flarum1-db-1

    environment:
      MYSQL_DATABASE: flarum
      MYSQL_USER: flarum
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret

    volumes:
      - db_data:/var/lib/mysql

    restart: always

    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-u","flarum","-psecret"]
      interval: 5s
      retries: 10


  app:

    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: flarum1-app

    depends_on:
      db:
        condition: service_healthy

    environment:

      APP_URL: https://devopsforum.nerdlab.co.in

      DB_HOST: db
      DB_NAME: flarum
      DB_USER: flarum
      DB_PASS: secret

    volumes:

      - flarum_storage:/var/www/html/storage

    restart: always



  nginx:

    image: nginx:alpine

    container_name: flarum1-nginx-1

    depends_on:
      - app

    ports:
      - "8000:80"

    volumes:

      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

      - flarum_storage:/var/www/html/storage:ro

      - ./frontend:/usr/share/nginx/html/custom:ro

    restart: always


volumes:

  db_data:
    name: flarum1_db_data

  flarum_storage:
